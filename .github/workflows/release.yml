name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  macos-release:
    name: Verify and publish macOS release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate semantic-version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use major.minor.patch without a v prefix" >&2
            exit 1
          fi

      - name: Run release preflight
        run: Scripts/verify-release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/swift-exif-macos-arm64.tar.gz \
            dist/swift-exif-macos-arm64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "SwiftMediaMetadata $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md
